services:
  postgres:
    image: postgres:16-alpine
    container_name: filajusta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: filajusta
      POSTGRES_USER: filajusta
      POSTGRES_PASSWORD: filajusta
    ports:
      - "5432:5432"
    volumes:
      - filajusta_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filajusta -d filajusta"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filajusta-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./storage/documents:/app/storage/documents
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  filajusta_pg_data:
